name: whiq-release

# WHIQ fork: the headless `wordcraft-cli` the White Hat IQ platform runs (MCP over stdio), built for
# Linux x86_64 (musl, static: the host's glibc does not matter) and Windows x86_64 (static CRT),
# with craft-fonts embedded at the one pin the three craft forks share. The contract tests run
# against the built binary on both systems before anything is published; the release carries
# the two archives, SHA256SUMS and engines.lock (the format of engines.lock.example, which the
# platform's build script reads). No signing, no secrets: the workflow's own GITHUB_TOKEN
# publishes. The upstream release.yml is untouched.
#
# Hardened (2026-10-20, as the P6 clone's and GridCraft's): a published asset is never replaced (the
# platform pins each by sha256 in engines.lock), a dispatch naming a tag that already exists builds
# that tag, and the archives are reproducible (the same commit gives the same archive bytes).
#
#   git tag whiq-v0.7.0 && git push whiq-fork whiq-v0.7.0     # build, test and publish
#   (or Actions › whiq-release › Run workflow: build and test; give a tag to publish it)

on:
  push:
    tags: ["whiq-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. whiq-v0.7.0 (empty: build and test only)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: whiq-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: wordcraft
  # The craft-fonts commit every craft fork pins (Latin presentation fonts, Noto Sans Arabic,
  # Japanese and Chinese): WHIQ-CHANGES.md, "Parity pass".
  CRAFT_FONTS_REF: 43913056ce82a3fdad0ef69f6b88d1dc922a8104
  CRAFT_FONTS_REQUIRED: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # What is built: a tag that already exists is built from the tag itself (a re-run never builds a
  # later commit under an old tag); a new tag from the commit the run was dispatched on, and the
  # release then creates the tag there.
  plan:
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ] && [ -n "${{ inputs.tag }}" ] && gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"; echo "building the existing tag $tag"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; echo "building $GITHUB_SHA"
          fi

  build:
    name: build (${{ matrix.platform }})
    needs: plan
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            exe: ""
          - platform: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - name: Check out craft-fonts at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - name: musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools poppler-utils
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: whiq-release-${{ matrix.target }}
      - name: Release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}";
          elif [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}";
          else tag="whiq-dev-$(git rev-parse --short=7 HEAD)"; fi
          case "$tag" in whiq-v*|whiq-dev-*) ;; *) echo "::error::release tags start with whiq-v (got $tag)"; exit 1;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build ${{ env.APP }}-cli
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          # A static C runtime on Windows: the .exe needs no Visual C++ redistributable.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked -p "$APP-cli" --target "${{ matrix.target }}"
      - name: Contract tests against the built binary
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          # A path the Windows test process understands (Git Bash's own is /d/a/...).
          ROOT="$PWD"; if [ "$RUNNER_OS" = "Windows" ]; then ROOT="$(pwd -W)"; fi
          BIN="$ROOT/target/${{ matrix.target }}/release/$APP-cli${{ matrix.exe }}"
          WORDCRAFT_CLI="$BIN" cargo test --release --locked -p "$APP-cli" --target "${{ matrix.target }}" --test mcp_contract
      - name: Smoke script against the built binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BIN="$PWD/target/${{ matrix.target }}/release/$APP-cli"
          file "$BIN" | tee /dev/stderr | grep -Eq "statically linked|static-pie linked"
          tests/mcp-contract/smoke.sh "$BIN"
      - name: Package
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          name="$APP-cli-$tag-${{ matrix.platform }}"
          mkdir -p "dist/$name/licenses/fonts"
          cp "target/${{ matrix.target }}/release/$APP-cli${{ matrix.exe }}" "dist/$name/"
          cp LICENSE-APACHE LICENSE-MIT NOTICE ATTRIBUTION.md WHIQ-CHANGES.md CONTRACT-PARITY.md "dist/$name/"
          # The embedded fonts' licences (OFL and others) travel with the binary that carries them.
          (cd craft-fonts/fonts && for d in */; do for f in "$d"*.txt "$d"LICENSE*; do [ -f "$f" ] && mkdir -p "../../dist/$name/licenses/fonts/$d" && cp "$f" "../../dist/$name/licenses/fonts/$d"; done; done; true)
          printf '%s\n' "$APP-cli $tag (${{ matrix.target }}), craft-fonts $CRAFT_FONTS_REF, commit $(git rev-parse HEAD)" > "dist/$name/BUILD.txt"
          # Reproducible: the same files give the same archive bytes (names sorted, every time the
          # commit's, no owners, no gzip stamp; the zip with fixed dates and modes).
          epoch="$(git log -1 --format=%ct)"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Inline (not a file in the tree): an existing tag built from an older commit has no such file.
            PY="$(command -v python3 || command -v python)"
            "$PY" - "$name" "$name.zip" "$epoch" <<'PY'
          import os, sys, time, zipfile
          src, out, epoch = sys.argv[1], sys.argv[2], int(sys.argv[3])
          stamp = time.gmtime(max(epoch, 315532800))[:6]  # zip dates start in 1980
          files = []
          for root, dirs, names in os.walk(src):
              files += [os.path.join(root, n) for n in names]
          with zipfile.ZipFile(out, "w") as z:
              for f in sorted(files, key=lambda p: p.replace(os.sep, "/")):
                  info = zipfile.ZipInfo(f.replace(os.sep, "/"), date_time=stamp)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3  # the same header on every runner
                  info.external_attr = (0o100755 if f.endswith(".exe") else 0o100644) << 16
                  with open(f, "rb") as fh:
                      z.writestr(info, fh.read(), compresslevel=9)
          PY
          else
            tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner -cf - "$name" | gzip -n > "$name.tar.gz"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-cli-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish
    needs: [plan, build]
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS and engines.lock
        shell: bash
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          cd dist
          sha256sum "$APP-cli-$tag-linux-x86_64.tar.gz" "$APP-cli-$tag-windows-x86_64.zip" > SHA256SUMS
          cat SHA256SUMS
          # The platform's build script reads this (format: engines.lock.example).
          python3 - "$APP" "$tag" > engines.lock <<'PY'
          import json, sys
          app, tag = sys.argv[1], sys.argv[2]
          rows = [line.split() for line in open("SHA256SUMS")]
          print(json.dumps([{"app": app, "tag": tag, "file": f, "sha256": h} for h, f in rows], indent=2))
          PY
          cat engines.lock
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          notes="Headless WordCraft ($APP-cli) for the White Hat IQ platform: MCP over stdio. Linux x86_64 (musl, static) and Windows x86_64. craft-fonts $CRAFT_FONTS_REF embedded. Contract: CONTRACT-PARITY.md and WHIQ-CHANGES.md in each archive. Checksums: SHA256SUMS; engines.lock for the platform build."
          commit="$(git -C src rev-parse HEAD)"
          cd dist
          # A published asset is never replaced: the platform pins each by sha256 (engines.lock), and
          # a replaced file would fail every install's verify. A release made first on GitHub's
          # Releases page, with no files yet, gets them added.
          #
          # The files go up one at a time onto a draft, which is published once all are there. An
          # upload can reach GitHub although its answer does not (whiq-v0.7.1: gh retried the 43 MB
          # zip and got 422 "already exists", then deleted its draft): after a failed upload the
          # file on the release is checked, kept when it is this file (size and sha256), and on a
          # draft only (never published) a partial one is removed and the upload tried again.
          draft=true
          if gh release view "$tag" >/dev/null 2>&1; then
            draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            n="$(gh release view "$tag" --json assets --jq '.assets | length')"
            if [ "$draft" != "true" ] && [ "$n" != "0" ]; then
              echo "::error::release $tag already has $n file(s); a published release is never overwritten: publish a new tag"
              exit 1
            fi
          else
            gh release create "$tag" --draft --target "$commit" --title "$APP-cli $tag" --notes "$notes"
          fi
          rid="$(gh release view "$tag" --json databaseId --jq .databaseId)"
          upload() {
            local f="$1" want size try got aid state asize adigest
            want="sha256:$(sha256sum "$f" | cut -d' ' -f1)"; size="$(stat -c %s "$f")"
            for try in 1 2 3 4 5; do
              got="$(gh api "repos/$GH_REPO/releases/$rid/assets" --paginate --jq ".[] | select(.name == \"$f\") | \"\(.id) \(.state) \(.size) \(.digest // \"-\")\"")" || got=""
              if [ -n "$got" ]; then
                read -r aid state asize adigest <<<"$got"
                if [ "$state" = uploaded ] && [ "$asize" = "$size" ] && { [ "$adigest" = "-" ] || [ "$adigest" = "$want" ]; }; then
                  echo "$f is on the release ($want)"; return 0
                fi
                if [ "$draft" != "true" ]; then
                  echo "::error::$f on the published release $tag is not this file ($state, $asize bytes, $adigest); it is never replaced: publish a new tag"; return 1
                fi
                echo "removing an incomplete $f from the draft ($state, $asize bytes)"
                gh api -X DELETE "repos/$GH_REPO/releases/assets/$aid"
              fi
              # Every upload is checked on the next turn; the fifth turn only checks.
              [ "$try" = 5 ] && break
              if ! gh release upload "$tag" "$f"; then
                echo "upload of $f failed (attempt $try); checking what reached the release"
                sleep $((try * 15))
              fi
            done
            echo "::error::$f could not be uploaded"; return 1
          }
          for f in ./*.tar.gz ./*.zip SHA256SUMS engines.lock; do upload "${f#./}"; done
          if [ "$draft" = "true" ]; then
            gh release edit "$tag" --draft=false --target "$commit"
          fi
          gh release view "$tag" --json tagName,isDraft,assets --jq '{tag: .tagName, draft: .isDraft, assets: [.assets[] | {name, size, digest}]}'

[package]
name = "wordcraft-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft MCP server: every command as a tool, headless or bridged to the running app"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-docx = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-control-key = { workspace = true }
# WHIQ parity pass: server_status reports the embedded craft-fonts faces.
wordcraft-fonts = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# WHIQ: native only (the web build has no signals, processes or resident memory to read).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# SIGTERM / SIGINT / SIGHUP (and console close on Windows) auto-save the open document.
# MIT/Apache-2.0, safe API (the platform calls are inside the crate).
ctrlc = { version = "3.4", features = ["termination"] }
# The process's resident memory on Linux, Windows (GetProcessMemoryInfo), macOS (task_info) and
# FreeBSD, for eviction and server_status. MIT/Apache-2.0, safe API.
memory-stats = { version = "1.2", default-features = false }
